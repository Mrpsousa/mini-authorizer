spring.application.name=mini-authorizer

# --- Datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/miniautorizador
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Erros ---
# nunca devolver stack trace no corpo (o devtools liga isso por padrão)
spring.web.error.include-stacktrace=never

# --- Autenticação BASIC (credencial da API, definida no contrato do README) ---
autorizador.seguranca.usuario=username
autorizador.seguranca.senha=password
